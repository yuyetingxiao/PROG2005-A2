<!-- search.html -->
<h1>Search Inventory</h1>

<div class="card">
  <input #searchInput (input)="onSearch(searchInput)" class="form-control" placeholder="Search by name" />

  <select #categorySelect (change)="onFilter(categorySelect)" class="form-control">
    <option value="">All Categories</option>
    <option value="Electronics">Electronics</option>
    <option value="Furniture">Furniture</option>
    <option value="Tools">Tools</option>
  </select>

  <div #msg class="message"></div>

  <ul class="item-list">
    <li *ngFor="let item of results">
      <strong>{{ item.name }}</strong>
      <p>Category: {{ item.category }} | Price: ${{ item.price }}</p>
    </li>
  </ul>
</div>
