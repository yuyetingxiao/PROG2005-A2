<!-- manage.html -->
<h2>Manage Inventory</h2>
<div class="add-item-form">
  <input [(ngModel)]="newItem.id" type="number" placeholder="Item ID" required>
  <input [(ngModel)]="newItem.name" placeholder="Item Name" required>
  <select [(ngModel)]="newItem.category">
    <option>Electronics</option>
    <option>Furniture</option>
    <option>Tools</option>
    <option>Clothing</option>
    <option>Miscellaneous</option>
  </select>
  <input [(ngModel)]="newItem.quantity" type="number" placeholder="Quantity" required>
  <input [(ngModel)]="newItem.price" type="number" placeholder="Price" required>
  <input [(ngModel)]="newItem.supplier" placeholder="Supplier" required>
  <label>
    <input [(ngModel)]="newItem.isPopular" type="checkbox"> Popular
  </label>
  <button (click)="addItem()">Add Item</button>
</div>

<div class="items-list">
  <h3>Item List</h3>
  <div class="item-row" *ngFor="let item of items">
    <span>{{ item.id }}</span>
    <span>{{ item.name }}</span>
    <span>{{ item.category }}</span>
    <span>Qty: {{ item.quantity }}</span>
    <span>${{ item.price }}</span>
    <span>{{ item.inStock ? 'In Stock' : 'Out of Stock' }}</span>
    <button (click)="deleteItemByName(item.name)">Delete</button>
    <button (click)="editItem(item.name)">Edit</button>
  </div>
</div>
