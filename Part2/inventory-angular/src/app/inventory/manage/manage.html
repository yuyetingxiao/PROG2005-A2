<!-- manage.html -->
<h1>Manage Inventory</h1>

<div class="add-item-form card">
  <input [(ngModel)]="newItem.id" type="number" placeholder="ID" />
  <input [(ngModel)]="newItem.name" placeholder="Item Name" />
  <input [(ngModel)]="newItem.category" placeholder="Category" />
  <input [(ngModel)]="newItem.quantity" type="number" placeholder="Quantity" />
  <input [(ngModel)]="newItem.price" type="number" placeholder="Price" />
  <input [(ngModel)]="newItem.supplier" placeholder="Supplier" />
  <label>
    <input [(ngModel)]="newItem.isPopular" type="checkbox" />
    Popular
  </label>
  <button (click)="addItem()">Add Item</button>
</div>

<div class="items-list card">
  <h2>Item List</h2>
  <div *ngFor="let item of items" class="item-row">
    <div>
      <strong>{{ item.name }}</strong>
      <p>{{ item.category }} | {{ item.quantity }} in stock</p>
    </div>
    <div class="actions">
      <button (click)="editItem(item.name)">Edit</button>
      <button class="delete" (click)="deleteItemByName(item.name)">Delete</button>
    </div>
  </div>
</div>
