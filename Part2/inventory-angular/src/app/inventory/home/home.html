<!-- home.html -->
<h1>Inventory Dashboard</h1>

<div class="dashboard-stats">
  <div class="stat-card">
    <h3>Total Items</h3>
    <p>{{ totalItems }}</p>
  </div>
  <div class="stat-card">
    <h3>Out of Stock</h3>
    <p>{{ outOfStockCount }}</p>
  </div>
</div>

<div class="popular-items card">
  <h2>Popular Items</h2>
  <div *ngFor="let item of popularItems" class="popular-item">
    <strong>{{ item.name }}</strong>
    <p>Category: {{ item.category }} | Stock: {{ item.quantity }}</p>
  </div>
</div>
