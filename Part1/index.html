<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Inventory Management System</h1>
    <div id="message"></div>

    <div class="form-container">
      <h3>Add New Item</h3>
      <input type="text" id="itemId" placeholder="Item ID">
      <input type="text" id="itemName" placeholder="Item Name">
      <select id="category">
        <option>Electronics</option>
        <option>Furniture</option>
        <option>Clothing</option>
        <option>Tools</option>
        <option>Miscellaneous</option>
      </select>
      <input type="number" id="quantity" placeholder="Quantity">
      <input type="number" id="price" placeholder="Price">
      <input type="text" id="supplierName" placeholder="Supplier">
      <select id="stockStatus">
        <option>In Stock</option>
        <option>Low Stock</option>
        <option>Out of Stock</option>
      </select>
      <label><input type="checkbox" id="isPopular"> Popular</label>
      <textarea id="comment" placeholder="Comment"></textarea>
      <button onclick="handleAddItem()">Add Item</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search by name">
      <button onclick="handleSearch()">Search</button>
      <div id="search-results"></div>
    </div>

    <div class="action-group">
      <input type="text" id="editName" placeholder="Name to edit">
      <button onclick="handleEdit()">Edit</button>

      <input type="text" id="deleteName" placeholder="Name to delete">
      <button onclick="handleDelete()">Delete</button>
    </div>

    <div class="grid">
      <div id="all-items"></div>
      <div id="popular-items"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
